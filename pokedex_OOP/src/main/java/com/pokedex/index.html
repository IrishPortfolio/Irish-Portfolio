<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokedex</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <h1>POKEDEX</h1>

  <div class="control-bar">
    <input type="text" id="pokemonId" placeholder="ID (e.g. 25)">
    <input type="text" id="pokemonName" placeholder="Name (e.g. Pikachu)">
    <input type="text" id="pokemonType" placeholder="Type (e.g. Electric)">
    <input type="text" id="pokemonHeight" placeholder="Height">
    <input type="text" id="pokemonWeight" placeholder="Weight">
    <input type="text" id="pokemonDesc" placeholder="Description">

    <button onclick="addPokemon()">Add</button>
  </div>

  <div class="search-section">
    <input type="text" id="searchInput" placeholder="Search by name...">
    <button onclick="searchPokemon()">Search</button>
  </div>

  <div class="filter-section">
    <select id="typeFilter" onchange="filterByType()">
      <option value="">Filter by Type</option>
      <option value="Fire">Fire</option>
      <option value="Water">Water</option>
      <option value="Grass">Grass</option>
      <option value="Electric">Electric</option>
    </select>
  </div>

  <h3>Pokemon List</h3>
  <table border="1" id="pokemonTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Height</th>
        <th>Weight</th>
        <th>Description</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
